name: Quality Candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Produce candidate-results.json and capture PR event
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_EVENT_PATH" pr-event.json
          jq -n \
            --argjson repoId "${{ github.event.repository.id }}" \
            --argjson prNumber "${{ github.event.pull_request.number }}" \
            --arg headSha "${{ github.event.pull_request.head.sha }}" \
            --arg baseSha "${{ github.event.pull_request.base.sha }}" \
            --arg runId "${{ github.run_id }}" \
            --arg runAttempt "${{ github.run_attempt }}" \
            '{
              schemaVersion: 1,
              repoId: $repoId,
              prNumber: $prNumber,
              headSha: $headSha,
              baseSha: $baseSha,
              runId: ($runId | tonumber),
              runAttempt: ($runAttempt | tonumber),
              profiles: ["ts-node-pnpm"],
              status: "ok"
            }' > candidate-results.json
          cat candidate-results.json

      - name: Upload candidate-results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-results
          path: |
            candidate-results.json
            pr-event.json
          retention-days: 5
          if-no-files-found: error
