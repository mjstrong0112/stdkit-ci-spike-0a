name: stdkit static policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stdkit-policy-static-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  static-gate:
    if: >-
      vars.STDKIT_POLICY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: stdkit-policy
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_REPO: ${{ github.repository }}
      PACK_SHA256: '3ee6a5b61d47b2be77f389e4e9a844c6e882decfb128571f0801f51eb72c9d70'
    steps:
      - name: Mint dedicated publisher token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.STDKIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.STDKIT_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Record live PR and start App check
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/stdkit-pr.json"
          head=$(jq -er --arg branch "$DEFAULT_BRANCH" \
            'select(.state == "open" and .base.ref == $branch) | .head.sha | select(test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/stdkit-pr.json")
          check=$(GH_TOKEN="$APP_TOKEN" gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='stdkit-policy / static-gate' -f head_sha="$head" -f status=in_progress --jq .id)
          [[ "$check" =~ ^[1-9][0-9]*$ ]] || exit 1
          printf 'check=%s\n' "$check" >> "$GITHUB_OUTPUT"

      - name: Set up trusted Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Mint CLI asset read token
        id: cli-asset
        if: >-
          vars.STDKIT_CLI_ARTIFACT_ID != '' &&
          vars.STDKIT_CLI_REPO != '' &&
          !contains(vars.STDKIT_CLI_REPO, ',') &&
          !contains(vars.STDKIT_CLI_REPO, fromJSON('"\n"'))
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.STDKIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.STDKIT_APP_PRIVATE_KEY }}
          owner: ${{ vars.STDKIT_CLI_OWNER || github.repository_owner }}
          repositories: ${{ vars.STDKIT_CLI_REPO }}
          permission-actions: read

      - name: Mint pack asset read token
        id: pack-asset
        if: >-
          vars.STDKIT_PACK_ASSET_ID != '' &&
          vars.STDKIT_PACK_REPO != '' &&
          !contains(vars.STDKIT_PACK_REPO, ',') &&
          !contains(vars.STDKIT_PACK_REPO, fromJSON('"\n"'))
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.STDKIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.STDKIT_APP_PRIVATE_KEY }}
          owner: ${{ vars.STDKIT_PACK_OWNER || github.repository_owner }}
          repositories: ${{ vars.STDKIT_PACK_REPO }}
          permission-contents: read

      - name: Provision digest-pinned CLI and pack
        id: provision
        env:
          CLI_URL: ${{ vars.STDKIT_CLI_URL }}
          CLI_OWNER: ${{ vars.STDKIT_CLI_OWNER || github.repository_owner }}
          CLI_REPO: ${{ vars.STDKIT_CLI_REPO }}
          CLI_ARTIFACT_ID: ${{ vars.STDKIT_CLI_ARTIFACT_ID }}
          CLI_TOKEN: ${{ steps.cli-asset.outputs.token }}
          CLI_SHA256: ${{ vars.STDKIT_CLI_SHA256 }}
          PACK_URL: ${{ vars.STDKIT_PACK_URL }}
          PACK_OWNER: ${{ vars.STDKIT_PACK_OWNER || github.repository_owner }}
          PACK_REPO: ${{ vars.STDKIT_PACK_REPO }}
          PACK_ASSET_ID: ${{ vars.STDKIT_PACK_ASSET_ID }}
          PACK_TOKEN: ${{ steps.pack-asset.outputs.token }}
          PACK_REF: ${{ vars.STDKIT_PACK_REF }}
        run: |
          [[ "$CLI_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$PACK_REF" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir "$RUNNER_TEMP/stdkit"
          cd "$RUNNER_TEMP/stdkit"
          if [[ -n "$CLI_ARTIFACT_ID" ]]; then
            [[ -z "$CLI_URL" ]] || exit 1
            [[ "$CLI_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$CLI_OWNER" =~ ^[A-Za-z0-9-]+$ ]] || exit 1
            [[ "$CLI_REPO" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
            [[ "$CLI_REPO" != "." && "$CLI_REPO" != ".." ]] || exit 1
            [[ "$CLI_TOKEN" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 1
            printf 'header = "Authorization: Bearer %s"\n' "$CLI_TOKEN" | \
              curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                --connect-timeout 15 --max-time 60 --max-filesize 10485760 --config - --output cli.zip \
                "https://api.github.com/repos/$CLI_OWNER/$CLI_REPO/actions/artifacts/$CLI_ARTIFACT_ID/zip"
            (( $(wc -c < cli.zip) <= 10485760 )) || exit 1
            unzip -Z1 cli.zip | grep -Fx stdkit.mjs > /dev/null
            unzip -p cli.zip stdkit.mjs | head -c 10485761 > stdkit.mjs
            (( $(wc -c < stdkit.mjs) <= 10485760 )) || exit 1
            rm -f cli.zip
          else
            [[ "$CLI_URL" == https://* ]] || exit 1
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 60 --max-filesize 10485760 --output stdkit.mjs "$CLI_URL"
            (( $(wc -c < stdkit.mjs) <= 10485760 )) || exit 1
          fi
          printf '%s  stdkit.mjs\n' "$CLI_SHA256" | sha256sum --check

          if [[ -n "$PACK_ASSET_ID" ]]; then
            [[ -z "$PACK_URL" ]] || exit 1
            [[ "$PACK_ASSET_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$PACK_OWNER" =~ ^[A-Za-z0-9-]+$ ]] || exit 1
            [[ "$PACK_REPO" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
            [[ "$PACK_REPO" != "." && "$PACK_REPO" != ".." ]] || exit 1
            [[ "$PACK_TOKEN" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 1
            mkdir -p "cache/$PACK_SHA256"
            printf 'header = "Authorization: Bearer %s"\n' "$PACK_TOKEN" | \
              curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                --connect-timeout 15 --max-time 60 --max-filesize 10485760 \
                -H 'Accept: application/octet-stream' --config - \
                --output "cache/$PACK_SHA256/pack.bundle.json" \
                "https://api.github.com/repos/$PACK_OWNER/$PACK_REPO/releases/assets/$PACK_ASSET_ID"
            (( $(wc -c < "cache/$PACK_SHA256/pack.bundle.json") <= 10485760 )) || exit 1
            printf '%s  cache/%s/pack.bundle.json\n' "$PACK_SHA256" "$PACK_SHA256" | sha256sum --check
          else
            [[ "$PACK_URL" == https://* ]] || exit 1
            pack_source=$(printf '%s' "$PACK_REF" | cut -d @ -f 1)
            env -u CLI_TOKEN -u PACK_TOKEN node stdkit.mjs fetch --cache-dir "$PWD/cache" \
              --pack "$PACK_REF" --sha256 "$PACK_SHA256" --sources-config "$PWD/no-sources.yaml" \
              --pack-source "$pack_source=$PACK_URL"
          fi

      - name: Fetch candidate Git objects
        id: fetch-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/stdkit"
          base=$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/stdkit-pr.json")
          head=$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/stdkit-pr.json")
          git init --bare --template= candidate.git
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$auth"
          git -C candidate.git -c "http.extraHeader=AUTHORIZATION: basic $auth" fetch --no-tags \
            "https://github.com/$GH_REPO.git" "$base:refs/stdkit/base" "refs/pull/$PR_NUMBER/head:refs/stdkit/head"
          test "$(git -C candidate.git rev-parse refs/stdkit/base)" = "$base"
          test "$(git -C candidate.git rev-parse refs/stdkit/head)" = "$head"
          cd candidate.git
          # The pilot freezes policy expectations until an explicit trusted update.
          git diff --quiet --no-ext-diff --no-textconv "$base" "$head" \
            -- .standards/lock.json .github/workflows/stdkit-policy.yml

      - name: Verify candidate Git objects offline
        id: verify
        env:
          PACK_REF: ${{ vars.STDKIT_PACK_REF }}
        run: |
          base=$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/stdkit-pr.json")
          head=$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/stdkit-pr.json")
          cd "$RUNNER_TEMP/stdkit/candidate.git"
          node ../stdkit.mjs verify "$base" --cache-dir ../cache \
            --pack "$PACK_REF" --sha256 "$PACK_SHA256" --json > "$RUNNER_TEMP/stdkit-base-report.json"
          node ../stdkit.mjs verify "$head" --cache-dir ../cache \
            --pack "$PACK_REF" --sha256 "$PACK_SHA256" --json > "$RUNNER_TEMP/stdkit-report.json"

      - name: Finalize the dedicated App check
        if: always() && steps.pr.outputs.check != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          CHECK: ${{ steps.pr.outputs.check }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          conclusion=failure
          previous=$(jq -ce '[.base.sha, .head.sha, .base.ref, .state]' "$RUNNER_TEMP/stdkit-pr.json")
          current=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" | jq -ce '[.base.sha, .head.sha, .base.ref, .state]')
          if [[ "$VERIFY_RESULT" == success && "$current" == "$previous" ]]; then
            conclusion=success
          fi
          GH_TOKEN="$APP_TOKEN" gh api --method PATCH "repos/$GH_REPO/check-runs/$CHECK" \
            -f status=completed -f conclusion="$conclusion" --silent
          test "$conclusion" = success
