name: Spike PR Review

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  review-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture pull_request_review event payload and context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr-review-evidence
          ACTION="${{ github.event.action }}"
          cp "$GITHUB_EVENT_PATH" "pr-review-evidence/pr-review-raw-${ACTION}-${{ github.run_id }}.json"
          jq -n \
            --arg eventName "${{ github.event_name }}" \
            --arg ref "${{ github.ref }}" \
            --arg sha "${{ github.sha }}" \
            --slurpfile ev "pr-review-evidence/pr-review-raw-${ACTION}-${{ github.run_id }}.json" \
            '{
              event_name: $eventName,
              ref: $ref,
              sha: $sha,
              action: $ev[0].action,
              review: {
                id: $ev[0].review.id,
                state: $ev[0].review.state,
                commit_id: $ev[0].review.commit_id,
                author_association: $ev[0].review.author_association,
                user_login: $ev[0].review.user.login
              },
              pull_request: {
                number: $ev[0].pull_request.number,
                head_sha: $ev[0].pull_request.head.sha,
                base_sha: $ev[0].pull_request.base.sha,
                head_repo_fork: $ev[0].pull_request.head.repo.fork,
                base_repo_id: $ev[0].pull_request.base.repo.id,
                head_repo_id: $ev[0].pull_request.head.repo.id
              }
            }' | tee "pr-review-evidence/pr-review-event-${ACTION}-${{ github.run_id }}.json"

      - name: Prove write permissions via Check Run creation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --include --method POST "/repos/${{ github.repository }}/check-runs" \
            -f name="stdkit-spike / pr-review-probe" \
            -f head_sha="${{ github.event.pull_request.head.sha }}" \
            -f status="completed" \
            -f conclusion="neutral" \
            -f "output[title]=pull_request_review (${{ github.event.action }}) write probe" \
            -f "output[summary]=Same-repo pull_request_review received checks:write and posted HTTP 201 check-run." \
            | sed -E 's/^([Ss]et-[Cc]ookie|[Aa]uthorization):.*/\1: [REDACTED]/' \
            | tee "pr-review-evidence/check-run-response-${{ github.event.action }}-${{ github.run_id }}.txt"

      - name: Upload pull_request_review evidence artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-review-${{ github.event.action }}-${{ github.run_id }}
          path: pr-review-evidence
          retention-days: 5
          if-no-files-found: error
