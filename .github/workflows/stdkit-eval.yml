name: Stdkit Policy Eval

on:
  workflow_run:
    workflows: ["Quality Candidate"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: stdkit-policy-eval-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Capture workflow_run event payload and M1 fields
        shell: bash
        env:
          WORKFLOW_RUN_CONTEXT: ${{ toJSON(github.event.workflow_run) }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp "$GITHUB_EVENT_PATH" evidence/eval-event.json
          printf '%s\n' "$WORKFLOW_RUN_CONTEXT" > evidence/github-event-workflow-run.json

          echo "=== M1 Event Payload Fields ==="
          jq '{
            workflow_run_id: .workflow_run.id,
            run_attempt: .workflow_run.run_attempt,
            event: .workflow_run.event,
            path: .workflow_run.path,
            workflow_id: .workflow_run.workflow_id,
            name: .workflow_run.name,
            head_branch: .workflow_run.head_branch,
            head_sha: .workflow_run.head_sha,
            head_repository_id: .workflow_run.head_repository.id,
            head_repository_full_name: .workflow_run.head_repository.full_name,
            repository_id: .repository.id,
            pull_requests: .workflow_run.pull_requests
          }' evidence/eval-event.json

      - name: Query Actions REST API endpoints for triggering run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          REPO="${{ github.repository }}"
          gh api "/repos/${REPO}/actions/runs/${RUN_ID}" > evidence/api-run.json
          gh api "/repos/${REPO}/actions/workflows" > evidence/api-workflows.json
          gh api "/repos/${REPO}/actions/runs/${RUN_ID}/artifacts" > evidence/api-artifacts.json

          echo "=== API vs Event Path Comparison ==="
          jq -n \
            --slurpfile ev evidence/eval-event.json \
            --slurpfile run evidence/api-run.json \
            --slurpfile wfs evidence/api-workflows.json \
            --slurpfile arts evidence/api-artifacts.json \
            '{
              event_workflow_run_path: $ev[0].workflow_run.path,
              api_run_path: $run[0].path,
              api_run_event: $run[0].event,
              api_run_head_repo_id: $run[0].head_repository.id,
              api_workflows: ($wfs[0].workflows | map({id, name, path, state})),
              api_artifacts: ($arts[0].artifacts | map({id, name, size_in_bytes, expired, workflow_run}))
            }'

      - name: Download candidate-results artifact cross-run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence/downloaded-candidate

      - name: Verify downloaded candidate-results.json
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/downloaded-candidate/candidate-results.json
          cat evidence/downloaded-candidate/candidate-results.json

      - name: Upload eval-evidence artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-evidence-${{ github.run_id }}
          path: evidence
          retention-days: 5
          if-no-files-found: error
