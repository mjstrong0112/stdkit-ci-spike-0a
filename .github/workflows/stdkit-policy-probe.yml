name: Stdkit Policy Probe

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: stdkit-policy-static-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture pull_request_target event and ref context (NO PR checkout)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prt-evidence
          ACTION="${{ github.event.action }}"
          cp "$GITHUB_EVENT_PATH" "prt-evidence/prt-event-${ACTION}-${{ github.run_id }}.json"

          jq -n \
            --arg ref "${{ github.ref }}" \
            --arg refName "${{ github.ref_name }}" \
            --arg sha "${{ github.sha }}" \
            --arg baseRef "${{ github.base_ref }}" \
            --arg headRef "${{ github.head_ref }}" \
            --arg eventName "${{ github.event_name }}" \
            --arg action "${{ github.event.action }}" \
            --arg workflowRef "${{ github.workflow_ref }}" \
            --slurpfile ev "prt-evidence/prt-event-${ACTION}-${{ github.run_id }}.json" \
            '{
              github_event_name: $eventName,
              github_action: $action,
              github_ref: $ref,
              github_ref_name: $refName,
              github_sha: $sha,
              github_base_ref: $baseRef,
              github_head_ref: $headRef,
              github_workflow_ref: $workflowRef,
              pr_number: $ev[0].pull_request.number,
              pr_base_ref: $ev[0].pull_request.base.ref,
              pr_base_sha: $ev[0].pull_request.base.sha,
              pr_head_ref: $ev[0].pull_request.head.ref,
              pr_head_sha: $ev[0].pull_request.head.sha,
              changes: ($ev[0].changes // null)
            }' | tee "prt-evidence/prt-summary-${ACTION}-${{ github.run_id }}.json"

      - name: Emit failing base static-gate check run on N1 probe branch
        if: github.event.pull_request.head.ref == 'feat/forge-n1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${{ github.repository }}/check-runs" \
            -f name="stdkit-policy / static-gate" \
            -f head_sha="${{ github.event.pull_request.head.sha }}" \
            -f status="completed" \
            -f conclusion="failure" \
            -f "output[title]=Base pull_request_target static-gate failed (N1 baseline)" \
            -f "output[summary]=Genuine base pull_request_target check intentionally failed to test N1 forgery." \
            > prt-evidence/base-static-gate-check-run.json
          cat prt-evidence/base-static-gate-check-run.json

      - name: Upload pull_request_target evidence artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prt-probe-${{ github.event.action }}-${{ github.run_id }}
          path: prt-evidence
          retention-days: 5
          if-no-files-found: error
